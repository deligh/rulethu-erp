<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rulethu &amp; Co. — Monthly Economic Brief</title>
<style id="baseCss">
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
 --g:#0e7848;--g2:#0b5e39;--g3:#07422a;--gl:#eefbf4;--gb:#a7e8c6;
 --navy:#0f2742;--navy2:#1e3a5f;
 --up:#0e7848;--dn:#b91c1c;--fl:#6b7280;
 --amb:#b45309;--ambl:#fffbeb;--ambb:#fde68a;
 --bd:#e5e7eb;--tx:#1f2937;--mu:#6b7280;--gold:#b7791f;--goldl:#fefce8
}
body{font-family:'Segoe UI',Calibri,Carlito,'Helvetica Neue',Arial,sans-serif;background:#eef0ec;color:var(--tx);font-size:13px;line-height:1.45}
input,textarea,select,button{font-family:inherit;font-size:inherit}
.app{max-width:1040px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--g);padding-bottom:10px;margin-bottom:8px}
.top img{height:42px}
.top .t2{font-size:13px;color:var(--mu);font-weight:600}.top .t2 small{display:block;font-size:10px;font-style:italic;font-weight:400}
.top .sp{flex:1}
.tools button,.tools label{padding:6px 12px;border:1px solid var(--g);background:#fff;color:var(--g);border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;margin-left:4px;display:inline-block}
.tools .pri{background:var(--g);color:#fff}
.tabs{display:flex;gap:2px}
.tb{padding:8px 20px;font-weight:700;font-size:12px;border:none;border-radius:6px 6px 0 0;cursor:pointer;background:#e5e7eb;color:#444}
.tb.on{background:var(--g);color:#fff}
.tb .qn{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:#dc2626;color:#fff;font-size:10px}
.tb .qn.ok{background:#16a34a}
.tc{border:1px solid var(--bd);border-radius:0 6px 6px 6px;padding:18px;background:#fff;min-height:500px}
/* entry */
.sec{margin-bottom:18px}
.sec-t{border-bottom:2px solid var(--g);color:var(--g);padding-bottom:3px;font-size:12px;font-weight:700;margin-bottom:8px;letter-spacing:.3px}
.hint{font-size:10.5px;color:var(--mu);margin:-4px 0 8px}
.fr{display:flex;flex-wrap:wrap;gap:8px 12px}
.fd{display:flex;flex-direction:column}
.fd label{font-size:10px;color:#555;font-weight:600;margin-bottom:2px}
.fd input{padding:4px 6px;border:1px solid #ccc;border-radius:4px;font-size:11.5px}
.fd textarea,.ta{padding:5px 7px;border:1px solid #ccc;border-radius:4px;font-size:11.5px;width:100%;resize:vertical;font-family:inherit}
.et{width:100%;border-collapse:collapse;font-size:11px}
.et th{text-align:left;padding:3px 4px;border-bottom:2px solid var(--g);font-size:10px;color:var(--g);white-space:nowrap}
.et td{padding:2px 3px;vertical-align:top}
.et input{width:100%;border:1px solid #ddd;border-radius:3px;padding:3px 5px;font-size:11px}
.et textarea{width:100%;border:1px solid #ddd;border-radius:3px;padding:3px 5px;font-size:11px;font-family:inherit;resize:vertical}
.et .calc{font-size:10.5px;color:var(--mu);white-space:nowrap;padding-top:6px;text-align:right}
.et .x{border:none;background:none;color:#dc2626;cursor:pointer;font-weight:700}
.add{margin-top:4px;padding:3px 10px;border:1px dashed var(--g);background:#fff;color:var(--g);border-radius:4px;font-size:10.5px;cursor:pointer}
.qa li{list-style:none;padding:6px 10px;border-radius:5px;margin-bottom:5px;font-size:12px}
.qa .e{background:#fef2f2;border-left:4px solid #dc2626}.qa .w{background:var(--ambl);border-left:4px solid #d97706}.qa .i{background:#eff6ff;border-left:4px solid #2563eb}
.qa .ok{background:var(--gl);border-left:4px solid #16a34a}
/* report */
.page{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.14);margin:0 auto 18px;max-width:794px;padding:30px 36px}
.rp{font-size:10px;line-height:1.5;color:var(--tx)}
.rhd{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--g);padding-bottom:6px;margin-bottom:12px}
.rhd img{height:34px}.rhd .t2{font-size:10px;color:var(--mu);font-weight:700}.rhd .t2 small{display:block;font-size:8px;font-weight:400;font-style:italic}
.rft{display:flex;justify-content:space-between;font-size:7.5px;color:#9ca3af;border-top:1px solid var(--bd);padding-top:4px;margin-top:10px}
/* cover */
.cover{background:linear-gradient(135deg,var(--g3) 0%,var(--navy) 100%);color:#fff;border-radius:10px;padding:26px 30px;margin-bottom:14px;position:relative;overflow:hidden}
.cover::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:40px solid rgba(255,255,255,.05);border-radius:50%}
.cover .eye{font-size:9px;font-weight:800;letter-spacing:3px;color:var(--gb);text-transform:uppercase}
.cover .rt{font-size:30px;font-weight:800;letter-spacing:.5px;margin-top:3px;line-height:1.05}
.cover .rd{font-size:13px;color:#d1fae5;margin-top:4px;font-weight:600}
.cover .ras{font-size:9px;color:#9fb8c9;font-style:italic;margin-top:8px;max-width:72%;line-height:1.5}
.hl4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
.hcard{border:1px solid var(--bd);border-top:3px solid var(--g);border-radius:7px;padding:9px 11px;background:#fff}
.hcard .ht{font-size:10px;font-weight:800;color:var(--g);margin-bottom:2px}
.hcard .hb{font-size:8.6px;color:#4b5563;line-height:1.4}
.rs{margin-bottom:11px}
.rst{border-bottom:2px solid var(--g);color:var(--g);padding-bottom:2px;font-size:12px;font-weight:800;margin-bottom:7px;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.rst .n{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--g);color:#fff;font-size:9px;font-weight:800}
.sub{font-size:10.5px;font-weight:700;margin:7px 0 3px;color:#111}
.tag{display:inline-block;font-size:7.5px;font-weight:800;letter-spacing:.4px;color:var(--g);border:1px solid var(--gb);background:var(--gl);border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:1px}
.lk{font-size:8.6px;color:var(--mu);margin:3px 0 6px}.lk a,.src a{color:#1d4ed8;text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.sparkpanel{grid-column:span 5;border:1px solid var(--bd);border-radius:6px;padding:5px 9px 2px;background:linear-gradient(180deg,var(--goldl),#fff);display:flex;flex-direction:column;justify-content:center}
.spk-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px}
.spk-t{font-size:7.5px;font-weight:700;color:var(--gold);letter-spacing:.3px}
.spk-v{font-size:11px;font-weight:800;color:#111}
.tile{border:1px solid var(--bd);border-radius:6px;padding:6px 6px;text-align:center;background:#fff}
.tile .l{font-size:7px;color:#555;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:13px;font-weight:800;color:#111;margin-top:2px;white-space:nowrap}
.tile .c{font-size:9px;font-weight:700}
.tile .s{font-size:7.5px;color:var(--mu)}
.view{border-left:4px solid var(--g);background:#fafaf9;padding:9px 13px;border-radius:0 7px 7px 0}
.view p{margin-bottom:5px;font-size:9.7px;line-height:1.46;text-align:justify}.view p:last-child{margin-bottom:0}
.view b{color:var(--g2)}
.tt{width:100%;border-collapse:collapse;margin-bottom:3px}
.tt th{background:var(--navy);color:#fff;padding:3px 6px;font-size:8.5px;font-weight:600;text-align:right;white-space:nowrap}
.tt th:first-child,.tt th.al{text-align:left}
.tt td{padding:2px 6px;font-size:9.3px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.tt td:first-child,.tt td.al{text-align:left}
.tt td.wrap{white-space:normal}
.tt td.mu{color:var(--mu)}
.tt tr.hl td{background:var(--gl);font-weight:700}
.tt tr.sub-row td{background:#f8fafc;font-weight:700;font-size:8.5px;color:var(--navy)}
.up{color:var(--up);font-weight:700}.dn{color:var(--dn);font-weight:700}.fl{color:var(--fl);font-weight:700}
.cm{font-size:9.5px;color:#374151;margin:3px 0 6px;line-height:1.46;text-align:justify}
.bi{display:flex;gap:6px;margin-bottom:3px;font-size:9.4px;line-height:1.42}.bi span:last-child{text-align:justify}.bi .d{color:var(--g);font-weight:800}
.src{color:#9ca3af;font-style:italic}
.fn{font-size:8.6px;color:var(--mu);margin-top:2px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.strip{display:flex;gap:5px;margin:4px 0 6px}
.strip .tile{flex:1}
.chartbox{border:1px solid var(--bd);border-radius:7px;padding:9px 11px 6px;background:#fcfcfb;margin:4px 0 6px}
.chartbox .ct{font-size:9.5px;font-weight:700;color:var(--navy);margin-bottom:2px}
.chartbox .cl{font-size:8px;color:var(--mu);margin-bottom:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:8px;color:#444;margin-top:3px}
.legend span{display:inline-flex;align-items:center;gap:3px}
.legend i{width:9px;height:3px;border-radius:2px;display:inline-block}
.gbox{background:var(--goldl);border:1px solid #fde68a;border-radius:7px;padding:9px 11px}
.flag{display:inline-block;font-size:7.5px;font-weight:700;color:var(--amb);border:1px solid var(--ambb);background:var(--ambl);border-radius:3px;padding:0 3px;margin-left:3px}
.about{display:flex;gap:16px;border-top:2px solid var(--g);padding-top:8px;margin-top:10px}
.about .a1{flex:2;font-size:8.8px;color:#444}.about .a2{flex:1;font-size:8.5px;color:#444}
.about .lb{font-weight:700;color:var(--g);font-size:8.5px}
.disc{font-size:7.8px;color:#9ca3af;line-height:1.4;border-top:1px solid var(--bd);margin-top:8px;padding-top:5px}
.pb{height:0}
@media screen{.pb{border-top:2px dashed #d1d5db;margin:16px -36px;position:relative}.pb::after{content:'page break';position:absolute;right:6px;top:-9px;font-size:9px;color:#9ca3af;background:#fff;padding:0 4px}}
@media print{
 body{background:#fff}
 .tile,.tt th,.gbox,.view,.up,.dn,.flag,.cover,.hcard,.chartbox,.rst .n{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

   <button type="button" onclick="saveJson()" title="Download this month's data as a .json file">Save data</button>

   <button type="button" class="pri" onclick="printPdf()">⬇ Download PDF</button>
  </span>
 </div>
 <div class="tabs">
  <button class="tb" id="tb-e" onclick="sw('e')">✎ Data Entry</button>

 </div>
 <div class="tc">
  <div id="pane-e" style="display:none"></div>
  <div id="pane-q" style="display:none"></div>
  <div id="pane-p"><div class="page"><div class="rp" id="rO"></div></div></div>
 </div>
</div>

function N(x){if(x===undefined||x===null)return null;var s=String(x).replace(/[, %]/g,'').replace(/[−–]/g,'-');if(s===''||s==='-')return null;var n=Number(s);return isNaN(n)?null:n;}
function esc(s){return String(s==null?'':s).replace(/&(?![a-z#0-9]+;)/gi,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rich(s){return esc(s).replace(/&lt;(\/?)(b|i|em|strong)&gt;/g,'<$1$2>');}
function fm(n,dp){if(n===null||n===undefined||isNaN(n))return'—';dp=(dp===undefined)?2:dp;return Number(n).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp});}
function cls(c){if(c===null)return'';return Math.abs(c)<0.005?'fl':(c>0?'up':'dn');}
function ps(c,dp){if(c===null||c===undefined)return'—';dp=dp===undefined?2:dp;var r=Number(c.toFixed(dp));return(r>0?'+':'')+fm(r,dp)+'%';}
function arw(c){if(c===null)return'';return Math.abs(c)<0.005?' ▬':(c>0?' ▲':' ▼');}
function cc(c,dp,noArrow){return'<span class="'+cls(c)+'">'+ps(c,dp)+(noArrow?'':arw(c))+'</span>';}
function mom(v,p){v=N(v);p=N(p);if(v===null||p===null||p===0)return null;return(v/p-1)*100;}
function ytd(v,b){v=N(v);b=N(b);if(v===null||b===null||b===0)return null;return(v/b-1)*100;}
function usdRet(r,fxN,fxB){fxN=N(fxN);fxB=N(fxB);if(r===null||fxN===null||fxB===null)return null;return((1+r/100)*(fxB/fxN)-1)*100;}

"view":"<b>October was a month of consolidation, not direction.</b> The ZSE All Share finished the month essentially flat near 478, trading a narrow 473–481 range after September's Delta-driven noise faded. Breadth stayed balanced and turnover thinned once the early-month block trades cleared. The real story sits beneath the index: the US$-denominated VFEX continued to attract the marginal buyer, extending a multi-month skew toward hard-currency assets that Rulethu views as the defining feature of this market.\n<b>The macro backdrop remains unusually benign for Zimbabwe.</b> ZWG month-on-month inflation eased to 0.2% and the ZWG held inside its 26.7–26.8 band against the US dollar for a seventh straight month, underwritten by roughly US$2bn of reserves and record January–September FX receipts. With the policy rate at 27.5% against single-digit inflation, real rates are deeply positive and the 17 November MPC has clear room to ease — the key question for 2027 positioning.\n<b>The sensitivity to watch is gold.</b> Bullion pulled back through October from the mid-$4,100s toward $4,000/oz, the first material monthly decline in the run that has powered Zimbabwe's export receipts and reserve build. Zimbabwe's external resilience is now visibly a gold story; a deeper or sustained correction, especially alongside still-elevated US yields, is the single clearest risk to the stability that is currently anchoring both the currency and the fiscus.",

"com":{
 "zse":"The ZSE All Share closed October near 478, essentially flat on the month (about +1.3% m/m) after a 473–481 range. The late-September Delta block that had distorted turnover washed through early in the month, leaving breadth balanced and genuine value modest. The Medium Cap remains the YTD leader among the ZWG indices, while the ETF Index was broadly unchanged.",
 "vfex":"The US$-denominated VFEX All Share extended its advance, up about 2.3% on the month to around 275, continuing the clear 2026 skew toward hard-currency assets. Padenga, Innscor and Simbisa led on steady offshore demand; Caledonia and Invictus were the notable laggards, the former tracking the softer gold tape.",
 "infl":"Inflation eased across the board in October. ZWG month-on-month inflation slowed to 0.2% (from 0.5%), USD to 0.1%, and the weighted rate to 0.1%. Annual readings remain in single digits. With the policy rate held at 27.5% against this backdrop, real rates are deeply positive — leaving the 17 November MPC room to continue the easing cycle if the ZWG holds.",
 "fx":"The ZWG was again remarkably stable, the RBZ interbank mid ending October around 26.72, inside the 26.7–26.8 band held all year and about 2.9% weaker than the end-2025 base of 25.98. The dollar firmed modestly (DXY toward 102.3) on the back of resilient US yields. Indicative street quotes of ZWG 30–33 per US dollar (about 40 for cash) remain well above the official rate and are the most useful gauge of residual FX stress.",
 "cmd":"October saw the first material pull-back in gold in several months, bullion easing from the mid-$4,100s toward $4,000/oz as US yields stayed elevated. Platinum and palladium softened in sympathy; Brent held near US$91. For Zimbabwe, softer precious-metal prices are the key threat to the export and reserve build that has underpinned 2026 stability, even as firmer oil adds to the import bill.",
 "gold":"Gold export receipts reached roughly US$4.45bn in the first eight months of 2026 (up from US$2.7bn a year earlier), with deliveries to Fidelity Gold Refinery of about 31.2 tons against a full-year target of 55.6 tons. Reserves of around US$2bn — close to two months of import cover — are the backbone of ZWG stability. The dependence is now the risk: Zimbabwe's external position moves with the gold price.",
 "intl":"Global markets stayed focused on the US rate path. Equities held near record territory but lost momentum as the 10-year Treasury yield remained elevated. The firmer dollar weighed on precious metals through the month, the single most important external channel for Zimbabwe given the weight of gold in export earnings.",
 "outlook":"The outlook into 2027 remains constructive but increasingly concentrated on one variable. Record FX receipts, ~US$2bn reserves, single-digit inflation and a stable ZWG give the RBZ room to keep easing, which should support both equity valuations and credit creation. The central risk is external and specific: a sustained correction in gold, alongside still-elevated US yields, would pressure receipts, reserves and — ultimately — the currency stability on which the entire benign scenario rests. Diversification of the export base remains the structural imperative."

function nextMonth(s){var p=s.split('-'),y=+p[0],m=+p[1]+1;if(m>12){m=1;y++;}return y+'-'+('0'+m).slice(-2);}
function rollForward(){
 if(!confirm('Start the next month?\n\nThis month\'s values become prior-month, the trend histories advance by one month, and movers, headlines and commentary are cleared. Save this month\'s data first if you have not.'))return;
 /* indices + caps + pairs + commodities: current → prior */
 function roll(a){(a||[]).forEach(function(r){if('v' in r&&'p' in r){r.p=r.v;r.v='';}});}
 roll(D.idx);roll(D.mktcap);roll(D.fx.pairs);roll(D.cmd);
 D.fx.zwgPrev=D.fx.zwgNow;D.fx.zwgNow='';
 /* inflation current → prior */
 D.infl.zwgMPrev=D.infl.zwgM;D.infl.usdMPrev=D.infl.usdM;D.infl.zwgYPrev=D.infl.zwgY;D.infl.usdYPrev=D.infl.usdY;
 D.infl.zwgM='';D.infl.usdM='';D.infl.zwgY='';D.infl.usdY='';D.infl.wtdM='';D.infl.wtdY='';
 D.policy.bprPrev=D.policy.bpr;
 /* movers, headlines, commentary, highlights cleared */
 (D.zseM||[]).forEach(function(r){Object.keys(r).forEach(function(k){r[k]='';});});
 (D.vfxM||[]).forEach(function(r){Object.keys(r).forEach(function(k){r[k]='';});});
 (D.highlights||[]).forEach(function(r){r.t='';r.b='';});
 (D.headlines||[]).forEach(function(r){r.t='';r.b='';r.s='';});
 Object.keys(D.com).forEach(function(k){D.com[k]='';});
 D.view='';
 /* advance histories: add a blank slot for the new month, keep last 12 */
 var nm=nextMonth(D.meta.month);
 D.inflHist.push({m:nm,zwg:'',usd:''});if(D.inflHist.length>13)D.inflHist.shift();
 D.fxHist.push({m:nm,v:''});if(D.fxHist.length>13)D.fxHist.shift();
 D.goldHist.push({m:nm,v:''});if(D.goldHist.length>13)D.goldHist.shift();
 var lastRec=(D.gold.recHist||[]).slice(-1)[0]||{rec:'',res:''};
 D.gold.recHist.push({m:MN3[(+nm.split('-')[1])-1],rec:'',res:''});if(D.gold.recHist.length>12)D.gold.recHist.shift();
 D.meta.prev=D.meta.month;D.meta.month=nm;
 persist();sw('e');
}
